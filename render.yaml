services:
  - type: web
    name: eventbook-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SALT_ROUNDS
        value: 10
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
